name: check contributions
on:
  pull_request:
    paths: ["names/**", "definitions/**", "ocm/check_names.py"]
  push:
    paths: ["names/**", "definitions/**", "ocm/check_names.py"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ocm/check_names.py
