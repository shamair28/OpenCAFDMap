# Push a version tag to publish a GitHub Release with OpenCAFDMap.zip, its SHA-256 and OpenLauncher-Setup.bat.
# The same file on every branch; the tag decides the channel (see ocm/updater.py, CONTRIBUTING.md):
#   v3.x.y       from main        OpenLauncher v3, GitHub's "latest" release (setup installs it by default)
#   v3.x.y-rc.N  from v3-testing  v3 preview: a pre-release, never "latest", no setup attached
#   v2.x.y       from v2          OpenLauncher v2 maintenance release: never "latest"; its setup installs v2
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ocm/check_names.py
      - run: python ocm/defs_manifest.py --check
      - run: python installer/build_release.py "${{ github.ref_name }}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          install_notes() {
            cat <<EOF
          ## Install
          1. Download **OpenLauncher-Setup.bat** below and double-click it.
             Windows may warn about a downloaded file: choose *More info* / *Run anyway* if you trust it.
          2. Pick the install folder (default: %LOCALAPPDATA%\\OpenCAFDMap). Setup checks for Python 3.10+
             (it can install it with winget), downloads **OpenCAFDMap.zip**, verifies its SHA-256 and
             creates Desktop / Start menu shortcuts.
          3. In OpenLauncher: set your E-Sys folder and press **Start E-Sys with Open CAFD Map**.

          **Upgrading:** use **Update launcher** in OpenLauncher, or run setup again; your workspace and settings are kept.
          **Manual install:** extract OpenCAFDMap.zip anywhere and run OpenLauncher.bat.
          Name updates arrive through OpenLauncher's **Check for updates** for every version, without reinstalling.
          EOF
          }
          mkdir -p dist/setup
          cp installer/OpenLauncher-Setup.bat dist/setup/OpenLauncher-Setup.bat
          assets="dist/OpenCAFDMap.zip dist/OpenCAFDMap.zip.sha256 dist/setup/OpenLauncher-Setup.bat"
          case "$TAG" in
            v2.*-*)
              echo "v2 pre-releases aren't a channel: tag v2.x.y" >&2; exit 1 ;;
            v2.*)
              # v2 maintenance: never "latest" (that is v3), and its setup installs and upgrades v2
              sed -i "s/^\$Channel = ''/\$Channel = 'v2'/" dist/setup/OpenLauncher-Setup.bat
              grep -q "^\$Channel = 'v2'" dist/setup/OpenLauncher-Setup.bat || { echo "setup not stamped for v2" >&2; exit 1; }
              title="OpenLauncher $TAG (v2)"
              extra="--latest=false"
              { cat <<EOF
          ## OpenLauncher v2 - maintenance release
          **OpenLauncher v3 is the current version:** [latest release](https://github.com/$REPO/releases/latest).
          v2 installs update to newer v2 releases only (**Update launcher**). To move to v3: **Updates > Try OpenLauncher v3**.
          The setup below installs and upgrades v2.

          EOF
                install_notes; } > notes.md ;;
            *-*)
              # a v3 preview: a pre-release, never "latest". No setup attached: the latest release's setup
              # installs it when given the tag (OCM_SETUP_TAG), which OpenLauncher does.
              assets="dist/OpenCAFDMap.zip dist/OpenCAFDMap.zip.sha256"
              title="OpenLauncher $TAG (v3 preview)"
              extra="--prerelease --latest=false"
              cat > notes.md <<EOF
          ## Preview - not the stable release
          **Try it:** in OpenLauncher v3, **Updates > Try the preview**; in v2 (2.3.4 or newer), **Updates > Try OpenLauncher v3**.
          Your workspace and settings are kept. A preview install follows newer previews and stable v3 releases.

          **Go back:** **Updates > Back to stable** installs the newest stable release.

          **Without OpenLauncher:** download OpenLauncher-Setup.bat from the [latest release](https://github.com/$REPO/releases/latest)
          and run it with the environment variable OCM_SETUP_TAG=$TAG set, or extract OpenCAFDMap.zip and run OpenLauncher.bat.
          EOF
              ;;
            v3.*)
              title="OpenLauncher $TAG"
              extra="--latest"
              install_notes > notes.md ;;
            *)
              echo "unexpected tag $TAG: v3.x.y, v3.x.y-rc.N or v2.x.y" >&2; exit 1 ;;
          esac
          gh release create "$TAG" $assets --title "$title" --notes-file notes.md --generate-notes $extra
